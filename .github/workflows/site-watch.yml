name: Site watch

# Checks the live site (tools/site_watch.py, #263 option A): about 7 minutes after each new image (the updater of the
# home server pulls it within 5 minutes), and each 15 minutes (GitHub starts a cron late or skips it under load).
# A failure opens one P0 ticket `site-down` with the error text of /api/health; a site that answers again closes it.
on:
  workflow_run:
    workflows: [Image]
    types: [completed]
    branches: [main]
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: site-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50                       # the merges after the version of the image
      - name: Wait for the updater of the home server
        if: github.event_name == 'workflow_run'
        run: sleep 420
      - name: Check the site
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/site_watch.py
