name: CI

# Checks on each PR and on main: Automerge merges an agent PR when the workflow "CI" is green (the jobs "quick" and
# "browser"). Before the job "browser", the browser tests ran only in the sessions: main broke 4 times in 90 merged PRs
# (#83, #134, #188; #203 left two red tests that no run saw), and each run that ran them met the break of another PR.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quick:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: python3 -m pip install -r requirements-dev.txt
      - run: npm ci
      - name: Lint
        run: ruff check . && npx @biomejs/biome check .
      - name: Fast tests
        run: python3 -m pytest -q && npx vitest run

  browser-shard:
    # The build and the browser tests (verify level 3) on the merged tree of the PR (pull_request checks out the merge
    # with main). The repository is public: the minutes are free. Three shards on three machines (#766): one worker
    # took 6.4 minutes for 343 tests, more than the wait of `ship_pr.py`. Each shard has its own server, database and
    # login, so the one worker of `playwright.config.ts` (#31) still holds in each shard.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser tests
        run: npx playwright test --shard=${{ matrix.shard }}/3
      - name: Speed on a phone
        # The home and the booking page in Lighthouse mobile on the build of the browser tests (#448, epic #446). It also
        # runs when a browser test failed. The margin: one run of a page can be about 1 s slower than the next (a frame
        # stall of headless Chromium), so the exact budget of scripts/lighthouse.mjs fails PRs that change nothing. The
        # simulated LCP leaves out the server time, so --ttfb fails a page that is slow on the server.
        # Only in shard 1: one table per PR (#766 split the job in 3 shards).
        if: ${{ !cancelled() && matrix.shard == 1 }}
        run: |
          export CHROME_PATH="$(node -e "console.log(require('playwright').chromium.executablePath())")"
          # pipefail: with no pipefail the status of the pipe is the status of tee (0), and the step never fails.
          set -o pipefail
          { echo '### Speed on a phone (Lighthouse mobile)'; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          status=0
          node scripts/lighthouse.mjs --runs 5 --margin 1000 --ttfb 600 --cls 0.1 | tee -a "$GITHUB_STEP_SUMMARY" || status=$?
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
      - name: Keep the report of a failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results-${{ matrix.shard }}
          path: test-results/
          retention-days: 7

  browser:
    # The check that Automerge, `ship_pr.py` (GATES) and `cycle_start.py` read: green only when each shard is green.
    needs: browser-shard
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check the shards
        run: |
          result="${{ needs.browser-shard.result }}"
          if [ "$result" != success ]; then
            echo "::error::A shard of the browser tests is $result: open the failed job browser-shard of this run"
            exit 1
          fi
