# Project values of the agent system (#905). The tools in tools/ read this file (framework/tools/agent_config.py).

repo = "Larspolo/tumach-dance"
owner = "Larspolo"
branch = "main"

[status]
issue = 1
label = "agent-status"
paused = "paused"

[commands]                      # change these to the commands of the project
install = "python3 -m pip install -r requirements-dev.txt && npm ci"
lint = "ruff check . && npx @biomejs/biome check ."
fast = "python3 -m pytest -q && npx vitest run"
slow = "npx playwright test"
server = ""
dev = "npm run dev"             # starts the development server on the owner's computer (the `try` skill); "" = none

[docs]
system = "framework/docs/SYSTEM.md"
steering = "framework/docs/STEERING.md"
learnings = "docs/LEARNINGS.md"
roadmap = "steering/project/ROADMAP.md"
